{% extends "base.html" %}

{% block title %}Пользователи{% endblock %}

{% block content %}
<h1>Пользователи</h1>
<p class="muted">Найдено: {{ users|length }}</p>
<div class="card-grid">
    {% for user in users %}
        <article class="content-card">
            <h2>{{ user.name }}</h2>
            <p class="muted">{{ user.email }}</p>
            <a href="{% url 'users:detail' user.id %}">Подробнее</a>
        </article>
    {% empty %}
        <p>Пользователи пока не добавлены.</p>
    {% endfor %}
</div>
{% endblock %}
